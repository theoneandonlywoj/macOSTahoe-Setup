onboarding = false

# 4-tier keyboard scheme (tier = modifier tier on top of the prefix):
#   Core        bare             help, settings, detach, reload, goto, picker, sidebar, copy, resize, scrollback, cycle
#   Tabs        bare             c / [ / ] / 1..9 / t / x
#   Panes       ctrl             focus h/j/k/l, swap ctrl+shift+h/j/k/l, split v/- , zoom, close, rename, last pane
#   Workspaces  shift            new, rename, close, prev/next shift+h/l, switch shift+1..9
#   Agents      ctrl             prev/next [/], focus ctrl+1..9, open notification target o
# Worktree keys (new_worktree, open_worktree, remove_worktree) intentionally unset;
# remote_image_paste keeps its built-in direct ctrl+v default (remote-only).
[keys]
prefix = "ctrl+b"

help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+u"
goto = "prefix+g"
workspace_picker = "prefix+w"
toggle_sidebar = "prefix+b"
copy_mode = "prefix+ctrl+y"
resize_mode = "prefix+ctrl+e"
edit_scrollback = "prefix+e"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

new_tab = "prefix+c"
next_tab = "prefix+]"
previous_tab = "prefix+["
switch_tab = "prefix+1..9"
rename_tab = "prefix+r"
close_tab = "prefix+x"

focus_pane_left = "prefix+ctrl+h"
focus_pane_down = "prefix+ctrl+j"
focus_pane_up = "prefix+ctrl+k"
focus_pane_right = "prefix+ctrl+l"
swap_pane_left = "prefix+ctrl+shift+h"
swap_pane_down = "prefix+ctrl+shift+j"
swap_pane_up = "prefix+ctrl+shift+k"
swap_pane_right = "prefix+ctrl+shift+l"
split_vertical = "prefix+ctrl+v"
split_horizontal = "prefix+ctrl+minus"
zoom = "prefix+ctrl+z"
close_pane = "prefix+ctrl+x"
rename_pane = "prefix+ctrl+r"
last_pane = "prefix+ctrl+shift+["

new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+x"
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"
switch_workspace = "prefix+shift+1..9"

previous_agent = "prefix+ctrl+["
next_agent = "prefix+ctrl+]"
focus_agent = "prefix+ctrl+1..9"
open_notification_target = "prefix+ctrl+o"